name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Lua syntax check
        run: for f in agent/*.lua agent/*/*.lua; do luajit -b "$f" /dev/null; done
      - run: luajit agent/https_tunnel_agent_test.lua
      - run: luajit agent/update/sha256_test.lua

  # Docker imageがbuildでき、空の/dataから起動してAgent artifactが配置されることを確かめる(#2)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: routemon-ci:test
          cache-from: type=gha,scope=linux/amd64
      - name: Smoke test (empty /data)
        run: |
          docker run -d --name routemon-smoke -p 8080:8080 routemon-ci:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker exec routemon-smoke ls /data/agent/releases
          docker exec routemon-smoke test -s /data/agent/releases/stable.lua
          docker exec routemon-smoke test -s /app/LICENSE
          docker exec routemon-smoke test -s /app/THIRD_PARTY_NOTICES.md
      - if: failure()
        run: docker logs routemon-smoke
