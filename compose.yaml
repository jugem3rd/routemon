# Routemon Community 標準構成(#12)
# 初回は http://<server-ip>:8080/ へBrowserでアクセスし、Setup Wizardを実行する。
# Setup完了後はCaddyがTLSを終端する(Public URLを設定するとCaddyへ反映される)。
# source checkoutからbuildするときは、compose.dev.yamlを重ねる:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
services:
  routemon:
    # ROUTEMON_VERSIONで版を固定できる(例: ROUTEMON_VERSION=0.1.0 docker compose up -d)。
    # 既定の0.1は、0.1.xの最新へ追従する。
    image: ghcr.io/jugem3rd/routemon:${ROUTEMON_VERSION:-0.1}
    restart: unless-stopped
    # 停止シグナルを確実に届け、正常終了(最大SHUTDOWN_GRACE_MS=5秒)を待ってから強制終了する(#151)
    init: true
    # Agentの同時接続1本につきFDが1つ要る。環境のhard limitが低い(1,024など)と、約1,000台で詰まる
    # (docs/community/loadtest.md §2.4)。Dockerの既定では問題にならないが、明示しておく
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 10s
    environment:
      # Caddyの管理APIへ設定を反映する(Docker socketはmountしない)
      CADDY_ADMIN_URL: http://caddy:2019
      CADDY_CONFIG_PATH: /data/caddy/routemon.caddyfile
    volumes:
      - routemon-data:/data
    ports:
      # Bootstrap用。Setup完了後は閉じてもよい(Caddy経由で使う)
      - "8080:8080"
    expose:
      - "8081"
      - "8082"

  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    depends_on:
      - routemon
    volumes:
      # Routemonが生成するCaddyfileを読む。読み取り専用のmountの下に別のvolumeは置けないため、
      # Caddy自身のdata(証明書)は既定の/dataへ、Routemonのdataは/routemonへ分ける。
      - routemon-data:/routemon:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # HTTPからHTTPSへのredirectと、証明書の取得(HTTP-01)に使う。Public URLがhttpのときは、これが入口になる
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Native WebGUIは専用origin(docs/core/webgui-relay-design.md §8)
      - "8443:8443"
    command: ["caddy", "run", "--config", "/routemon/caddy/routemon.caddyfile", "--adapter", "caddyfile", "--watch"]

volumes:
  routemon-data:
  caddy-data:
  caddy-config:
